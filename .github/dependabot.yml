version: 2
updates:
  # Workflow actions are pinned by commit SHA; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Base images in the Dockerfile are pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]

  # Hash-pinned build and publish tools (.github/release-requirements.txt).
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    groups:
      release-tools:
        patterns: ["*"]
