[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-oss-azure-opencode-shim"
version = "0.4.0"
description = "Compatibility shim that fixes silent API failures when using Azure-hosted GPT-OSS models with OpenCode."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gabriel" }]
maintainers = [{ name = "Gabriel" }]
keywords = [
    "opencode",
    "azure-ai-foundry",
    "gpt-oss",
    "llm",
    "ai-agents",
    "compatibility-shim",
    "openai-compatible",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "prometheus-client>=0.20",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.25",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-jsonschema>=4.21",
]

[project.urls]
Homepage = "https://github.com/Gabrielm3/gpt-oss-azure-opencode-shim"
Documentation = "https://github.com/Gabrielm3/gpt-oss-azure-opencode-shim#readme"
Source = "https://github.com/Gabrielm3/gpt-oss-azure-opencode-shim"
Issues = "https://github.com/Gabrielm3/gpt-oss-azure-opencode-shim/issues"
Changelog = "https://github.com/Gabrielm3/gpt-oss-azure-opencode-shim/releases"

[project.scripts]
gpt-oss-azure-opencode-shim = "gpt_oss_shim.shim:main"
gpt-oss-azure-opencode-shim-report = "gpt_oss_shim.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpt_oss_shim = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# The otel extra is optional; its absence is handled at import time.
module = ["opentelemetry.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["gpt_oss_shim"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
